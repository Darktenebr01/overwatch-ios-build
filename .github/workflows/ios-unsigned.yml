name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project OverwatchSuite.xcodeproj \
            -scheme OverwatchSuite \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/OverwatchSuite.app"
          test -d "$APP"
          rm -rf Payload OverwatchSuite-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry OverwatchSuite-unsigned.ipa Payload
          ls -lh OverwatchSuite-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OverwatchSuite-unsigned-ipa
          path: ios/OverwatchSuite-unsigned.ipa
          if-no-files-found: error
