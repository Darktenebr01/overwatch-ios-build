name: OverwatchSuite
options:
  bundleIdPrefix: com.overwatch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  OverwatchSuite:
    type: application
    platform: iOS
    sources:
      - path: OverwatchSuite
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.overwatch.suite
        PRODUCT_NAME: OverwatchSuite
        INFOPLIST_FILE: OverwatchSuite/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
schemes:
  OverwatchSuite:
    build:
      targets:
        OverwatchSuite: all
    run:
      config: Debug
    archive:
      config: Release
